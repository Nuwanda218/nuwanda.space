server {
    listen 80;
    listen [::]:80;
    server_name nuwanda.space www.nuwanda.space;
    return 301 https://nuwanda.space$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nuwanda.space;
    ssl_certificate /etc/ssl/nuwanda.space/nuwanda.space.pem;
    ssl_certificate_key /etc/ssl/nuwanda.space/nuwanda.space.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:nuwanda_tls:1m;
    ssl_session_timeout 1d;
    server_tokens off;
    root /srv/nuwanda-blog/current/dist/client;
    autoindex off;
    access_log /var/log/nginx/nuwanda.space.access.log;
    error_log /var/log/nginx/nuwanda.space.error.log;
    location ~ /\. { deny all; }
    location ~* \.(?:key|pem|crt|zip)$ { deny all; }
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://127.0.0.1:4323;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nuwanda.space;
    ssl_certificate /etc/ssl/nuwanda.space/nuwanda.space.pem;
    ssl_certificate_key /etc/ssl/nuwanda.space/nuwanda.space.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://nuwanda.space$request_uri;
}
