name: nuwanda-space-local
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: nuwanda_local_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run npm run setup first}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Run npm run setup first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${DB_PORT:?Run npm run setup first}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-local-dev.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuwanda_local_admin -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    mem_limit: 384m
    restart: "no"
volumes:
  postgres_data:
